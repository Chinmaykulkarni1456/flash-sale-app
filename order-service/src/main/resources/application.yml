server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db  # Localhost for IntelliJ
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    public-key: "classpath:rs256-public.pem"

reservation:
  service:
    url: http://localhost:8082  # Localhost for IntelliJ

---
# ==========================================
# Docker Profile Configuration
# ==========================================
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/order_db  # Docker service name

security:
  jwt:
    public-key: "classpath:rs256-public.pem"

reservation:
  service:
    url: http://reservation-service:8082  # Docker container name