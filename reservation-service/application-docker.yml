spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/reservation_db
    username: postgres
    password: password
  config:
    activate:
      on-profile: docker
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

security:
  jwt:
    public-key: "classpath:/public-key.pem"

inventory:
  service:
    url: http://inventory-service:8081
