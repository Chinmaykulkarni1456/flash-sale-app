# Disable Flyway during unit/integration tests if using H2
spring.flyway.enabled=false

# Database setup for H2 in-memory testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# JWT Security Test Mock Key

security.jwt.public-key=file:C:/Users/Chinmay H Kulkarni/public.pem

inventory.service.url=http://localhost:8081